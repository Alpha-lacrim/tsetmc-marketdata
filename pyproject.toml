[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tsetmc-marketdata"
version = "0.1.0"
description = "Independent TSETMC PostgreSQL collector and daily ChartData adapter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "httpx>=0.28.1,<0.29",
    "jdatetime>=5.2,<6",
    "jsonschema>=4.23,<5",
    "sqlalchemy[asyncio]>=2.0.55,<2.1",
    "tzdata>=2025.2",
]

[project.scripts]
tsetmc-marketdata = "tsetmc_marketdata.cli:main"
tsetmc-simple = "tsetmc_marketdata.simple_collector:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1,<2", "pytest-socket>=0.7,<1", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-jsonschema>=4.23,<5"]

[tool.hatch.build]
exclude = [
    "/.local/**", "/docs/evidence/**", "/.venv/**", "/output/**", "/dist/**",
    # Local conversation notes are unrelated to application distributions.
    "/TSECMC_ConvHistory/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsetmc_marketdata"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tsetmc_marketdata/migrations"
"alembic.ini" = "tsetmc_marketdata/alembic.ini"
"config/instruments.example.json" = "tsetmc_marketdata/data/instruments.json"
"docs/contracts/milestone3b/schema.json" = "tsetmc_marketdata/data/tsetmc.v1.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
asyncio_mode = "auto"
markers = [
    "live: explicit, bounded internet tests; requires --live",
    "private_capture: regression tests requiring locally retained, unpublished source captures",
    "postgres: integration tests using independently created disposable PostgreSQL databases",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = "jdatetime.*"
ignore_missing_imports = true
